<!-- Lookbook page: one product, photographed large, with the copy beneath. -->
<article class="card">
  <div class="card-body">
    {{#if hasImage}}<img src="{{imageSrc}}" alt="{{name}}">{{/if}}
  </div>

  <div class="card-text">
    {{#if category}}<span class="card-category">{{category}}</span>{{/if}}
    <h2 class="card-title {{nameClass}}">{{name}}</h2>
    {{#if hasBrand}}<p class="card-brand">{{brand}}</p>{{/if}}
    {{#if hasDescription}}<p class="card-note">{{description}}</p>{{/if}}
    {{#if hasSizes}}
      <div class="sizes-block">
        <span class="sizes-label">Pack sizes</span>
        <div class="sizes">{{{sizesHtml}}}</div>
      </div>
    {{/if}}
  </div>
</article>
