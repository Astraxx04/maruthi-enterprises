<!-- Cover page.
     Tokens: businessName, tagline, address, gstin, email, phone, assets -->
<section class="sheet">
  {{#if flourishTopLeft}}<img class="flourish flourish--top-left" src="{{assets}}/flourish.png" alt="">{{/if}}
  {{#if flourishBottomRight}}<img class="flourish flourish--bottom-right" src="{{assets}}/flourish.png" alt="">{{/if}}

  <div class="cover">
    <h1 class="cover-title">{{businessName}}</h1>

    <div class="cover-lines">
      {{#if address}}<div>{{address}}</div>{{/if}}
      {{#if gstin}}<div>{{gstin}}</div>{{/if}}
      {{#if email}}<div>Email: {{email}}</div>{{/if}}
    </div>

    {{#if phone}}<div class="cover-mobile">Mob: {{phone}}</div>{{/if}}

    <div class="cover-spacer"></div>

    {{#if tagline}}<div class="cover-tagline">{{tagline}}</div>{{/if}}
    {{#if showBlessing}}<div class="cover-blessing"><img src="{{assets}}/cover-blessing.png" alt=""></div>{{/if}}
  </div>
</section>
