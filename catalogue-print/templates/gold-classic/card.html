<!-- One product card.
     Tokens: name, nameClass, brand, sizesHtml, description, imageSrc,
             category, index, hasImage, hasSizes, hasBrand, hasDescription
     Use {{#if token}} … {{/if}} to show something only when it exists. -->
<article class="card">
  <img class="card-corner card-corner--tl" src="{{assets}}/card-corner.png" alt="">
  <img class="card-corner card-corner--tr" src="{{assets}}/card-corner.png" alt="">
  <img class="card-corner card-corner--br" src="{{assets}}/card-corner.png" alt="">
  <img class="card-corner card-corner--bl" src="{{assets}}/card-corner.png" alt="">

  <header class="card-head">
    <h2 class="card-title {{nameClass}}">{{name}}</h2>
    {{#if hasBrand}}<p class="card-brand">{{brand}}</p>{{/if}}
  </header>

  <div class="divider"><img src="{{assets}}/title-clover.png" alt=""></div>

  <div class="card-body">
    {{#if hasImage}}<img src="{{imageSrc}}" alt="{{name}}">{{/if}}
    {{#if hasSizes}}<div class="sizes">{{{sizesHtml}}}</div>{{/if}}
  </div>

  {{#if hasDescription}}<p class="card-note">{{description}}</p>{{/if}}
</article>
