<section class="sheet">
  <div class="glow" aria-hidden="true"></div>
  <header class="running-head">
    <span class="running-brand"><span class="dot"></span>{{businessName}}</span>
    {{#if hasPageCategory}}<span class="running-category">{{pageCategories}}</span>{{/if}}
  </header>

  <div class="grid">{{{cards}}}</div>

  {{#if showFooter}}<div class="page-number">{{footer}}</div>{{/if}}
</section>
