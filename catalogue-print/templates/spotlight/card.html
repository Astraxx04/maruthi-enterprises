<!-- Spotlight band: photograph on one side, copy on the other.
     {{#if even}} flips the sides on alternate cards. -->
<article class="card {{#if even}}card--flipped{{/if}}">
  <div class="card-body">
    {{#if hasImage}}<img src="{{imageSrc}}" alt="{{name}}">{{/if}}
  </div>

  <div class="card-text">
    {{#if category}}<span class="card-category">{{category}}</span>{{/if}}
    <h2 class="card-title {{nameClass}}">{{name}}</h2>
    {{#if hasBrand}}<p class="card-brand">by {{brand}}</p>{{/if}}
    {{#if hasDescription}}<p class="card-note">{{description}}</p>{{/if}}
    {{#if hasSizes}}
      <div class="sizes-block">
        <span class="sizes-label">Available in</span>
        <div class="sizes">{{{sizesHtml}}}</div>
      </div>
    {{/if}}
  </div>
</article>
