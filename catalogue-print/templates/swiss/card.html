<!-- Swiss card: running number, photograph, name, sizes in monospace. -->
<article class="card">
  <span class="card-number">{{number}}</span>
  <div class="card-media">
    {{#if hasImage}}<img src="{{imageSrc}}" alt="{{name}}">{{/if}}
  </div>
  <div class="card-text">
    <h2 class="card-title {{nameClass}}">{{name}}</h2>
    {{#if hasSizes}}<div class="sizes">{{{sizesHtml}}}</div>{{/if}}
  </div>
</article>
