# Netlify build settings for the Maruthi Enterprises catalogue.
#
# The Next.js plugin turns the App Router build into Netlify Functions and
# static assets; nothing else needs configuring. Environment variables live in
# Netlify's dashboard (Site configuration → Environment variables), never here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # SUPABASE_STORAGE_BUCKET is a bucket name ("product-images"), not a secret:
  # it has to appear in supabase/schema.sql to create the bucket at all. Telling
  # the scanner to skip that one key keeps real findings visible.
  # Nothing else belongs here — if the scanner flags another variable, it is
  # either genuinely leaking or set to a value that is public on the site.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_STORAGE_BUCKET"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The 160 product photographs are static files in the repository, so they are
# served straight from the CDN and can be cached hard — their names change
# whenever the picture does.
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/template-previews/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The admin area must never be indexed, whatever a stray link says.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
